name: daily-outreach-leads

on:
  schedule:
    - cron: "30 4 * * *"   # 09:30 Pakistan time (04:30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print only, change nothing"
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    environment: refresh_token.txt   # the GitHub Environment that holds the 5 secrets
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python discover_leads.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          DISCOVER_LIMIT: ${{ vars.DISCOVER_LIMIT || '10' }}
          DISCOVER_INDUSTRIES: ${{ vars.DISCOVER_INDUSTRIES }}
          DISCOVER_HEADCOUNT: ${{ vars.DISCOVER_HEADCOUNT }}
          DISCOVER_COUNTRIES: ${{ vars.DISCOVER_COUNTRIES }}
          DISCOVER_KEYWORDS: ${{ vars.DISCOVER_KEYWORDS }}
      - run: python find_emails.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
