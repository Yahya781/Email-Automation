name: daily-outreach-drafts

on:
  schedule:
    - cron: "30 4 * * *"   # 09:30 Pakistan time (04:30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print only, change nothing"
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python find_emails.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      - run: python run_daily.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '5' }}
          OUTREACH_START_DATE: ${{ vars.OUTREACH_START_DATE }}
